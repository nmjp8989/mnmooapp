<style>
:root{

}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;height:100dvh;overflow:hidden;touch-action:manipulation;overscroll-behavior:none;-webkit-user-select:none;user-select:none;font-family:'Nunito',sans-serif;background:#9bdcff;color:var(--ink)}
button{font:inherit}
#game{position:relative;width:100%;height:100%;height:100dvh;overflow:hidden;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 70%,#a8e294 70%,#70c96d 100%)}
.sky-shape{position:absolute;border-radius:50%;background:rgba(255,255,255,.7);filter:blur(.2px);pointer-events:none}
.cloud{position:absolute;height:20px;width:72px;background:rgba(255,255,255,.75);border-radius:30px;animation:cloudMove 18s linear infinite;pointer-events:none}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud::before{width:32px;height:32px;left:10px;top:-16px}.cloud::after{width:40px;height:40px;right:8px;top:-21px}
.cloud.c2{top:23%;left:-90px;animation-duration:24s;animation-delay:-8s;transform:scale(.75)}.cloud.c1{top:8%;left:-100px}
@keyframes cloudMove{to{left:110%}}
.bubble{position:absolute;bottom:-30px;border:2px solid rgba(255,255,255,.65);background:rgba(255,255,255,.16);border-radius:50%;animation:rise var(--d) linear infinite;left:var(--x);width:var(--s);height:var(--s);pointer-events:none}
@keyframes rise{to{transform:translateY(-115vh) translateX(25px);opacity:0}}
.layout{position:relative;z-index:5;height:100%;display:grid;grid-template-columns:minmax(210px,31vw) 1fr minmax(130px,22vw);gap:clamp(8px,1.5vw,20px);align-items:center;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.guide{grid-column:3;grid-row:1;height:94%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;position:relative}
.guide-bubble{position:absolute;top:3%;left:2%;right:2%;background:#fff;border:3px solid rgba(24,51,79,.12);border-radius:22px;padding:10px 12px;text-align:center;font-family:'Fredoka',sans-serif;font-size:clamp(13px,2.6vh,20px);line-height:1.15;box-shadow:0 8px 0 rgba(24,51,79,.08);min-height:60px;display:flex;align-items:center;justify-content:center}
.guide-bubble::after{content:"";position:absolute;bottom:-13px;left:48%;border:7px solid transparent;border-top-color:#fff}
.mascot-container{transform:scale(clamp(.78,1.8vh,1.05));transform-origin:bottom center;margin-bottom:5vh}
.mascot-sprite{width:72px;height:128px;image-rendering:pixelated;transform:translateZ(0)}
.mascot-sprite.idle{background-image:url('../../assets/cow/idle.webp');background-size:216px 128px;animation:spIdle .6s steps(3) infinite}
@keyframes spIdle{to{background-position:-216px 0}}
.mascot-sprite.dancing{background-image:url('../../assets/cow/rhythm.webp');background-size:432px 128px}
.mascot-sprite.sad{background-image:url('../../assets/cow/sadface.webp');background-size:144px 128px;animation:spSad .5s steps(2) infinite}
@keyframes spSad{to{background-position:-144px 0}}
.picture-zone{grid-column:1;grid-row:1;height:min(88vh,430px);background:var(--card);border:4px solid rgba(255,255,255,.8);border-radius:30px;box-shadow:0 12px 0 rgba(24,51,79,.10),0 18px 40px rgba(24,51,79,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:clamp(8px,2vh,18px)}
.picture-zone::before{content:"";position:absolute;inset:auto -15% -24% -15%;height:45%;background:#dff5d9;border-radius:50%}
.picture-button{position:relative;border:0;background:transparent;width:min(25vw,210px);height:min(47vh,215px);display:flex;align-items:center;justify-content:center;cursor:pointer;animation:pictureFloat 2.4s ease-in-out infinite;z-index:2}
.picture-button:active{transform:scale(.94)}
.picture-button svg{width:100%;height:100%;filter:drop-shadow(0 10px 8px rgba(24,51,79,.13))}
@keyframes pictureFloat{50%{transform:translateY(-7px) rotate(1deg)}}
.picture-word{position:relative;z-index:2;font-family:'Fredoka',sans-serif;font-size:clamp(22px,6vh,45px);font-weight:700;margin-top:-2px;text-transform:capitalize;letter-spacing:.5px}
.listen-hint{position:absolute;top:10px;right:10px;width:44px;height:44px;border:0;border-radius:50%;background:var(--blue);color:#fff;font-size:22px;box-shadow:0 5px 0 var(--blue-dark);cursor:pointer;z-index:4}
.listen-hint:active{transform:translateY(3px);box-shadow:0 2px 0 var(--blue-dark)}
.read-zone{grid-column:2;grid-row:1;height:min(88vh,430px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2vh,16px);min-width:0}
.prompt{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(17px,3.5vh,28px);color:#18334f;text-align:center;background:rgba(255,255,255,.72);padding:8px 18px;border-radius:999px;box-shadow:0 5px 0 rgba(24,51,79,.08)}
.letter-row{width:100%;display:flex;justify-content:center;align-items:center;gap:clamp(6px,1.1vw,13px);min-height:clamp(82px,24vh,126px);padding:6px}
.letter-tile{position:relative;min-width:clamp(58px,10vw,112px);height:clamp(74px,22vh,118px);padding:0 clamp(8px,1.5vw,18px);border:4px solid rgba(24,51,79,.10);border-radius:24px;background:#fff;color:var(--ink);font-family:'Fredoka',sans-serif;font-size:clamp(35px,10vh,72px);font-weight:700;text-transform:lowercase;box-shadow:0 9px 0 rgba(24,51,79,.13),0 14px 28px rgba(24,51,79,.12);cursor:pointer;transition:transform .18s,background .18s,border-color .18s,opacity .18s}
.letter-tile.next{border-color:var(--yellow);background:#fff8cf;animation:glow 1s ease-in-out infinite}
.letter-tile.done{background:#ddf8e7;border-color:#7edb9f;transform:translateY(6px);box-shadow:0 3px 0 rgba(24,51,79,.10);color:#19844a}
.letter-tile.waiting{opacity:.72}
.letter-tile.wiggle{animation:wiggle .38s ease}
@keyframes glow{50%{transform:translateY(-8px) scale(1.05);box-shadow:0 13px 0 rgba(24,51,79,.13),0 0 0 8px rgba(255,216,90,.28)}}
@keyframes wiggle{25%{transform:translateX(-8px) rotate(-3deg)}50%{transform:translateX(7px) rotate(3deg)}75%{transform:translateX(-4px)}}
.blend-line{height:48px;display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-size:clamp(24px,5.5vh,42px);font-weight:700;color:#1675c1;letter-spacing:2px;text-align:center}
.helper{font-size:clamp(13px,2.5vh,19px);font-weight:800;color:var(--muted);text-align:center;min-height:28px}
.spark{position:fixed;z-index:50;pointer-events:none;font-size:var(--fs);animation:sparkFly .9s ease-out forwards}
@keyframes sparkFly{to{transform:translate(var(--dx),var(--dy)) rotate(200deg) scale(.2);opacity:0}}
.word-celebrate .letter-tile.done{animation:wordBounce .55s ease both}
.word-celebrate .letter-tile.done:nth-child(2){animation-delay:.08s}.word-celebrate .letter-tile.done:nth-child(3){animation-delay:.16s}.word-celebrate .letter-tile.done:nth-child(4){animation-delay:.24s}
@keyframes wordBounce{50%{transform:translateY(-15px) rotate(-3deg) scale(1.08)}}
.transition-cover{position:absolute;inset:0;z-index:30;pointer-events:none;background:radial-gradient(circle at 70% 50%,rgba(255,255,255,.92),rgba(255,255,255,0) 56%);opacity:0}
.transition-cover.show{animation:swish .65s ease}
@keyframes swish{50%{opacity:1}}
.rotate-message{display:none;position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#8ed8ff,#dff6ff);align-items:center;justify-content:center;text-align:center;padding:30px;font-family:'Fredoka',sans-serif;font-size:24px;font-weight:700;color:var(--ink)}
.rotate-message span{display:block;font-size:64px;margin-bottom:12px;animation:turn 1.4s ease-in-out infinite}
@keyframes turn{50%{transform:rotate(90deg)}}
@media(orientation:portrait){.rotate-message{display:flex}}
@media(orientation:landscape) and (max-height:390px){
  .layout{grid-template-columns:minmax(180px,29vw) 1fr 110px;gap:8px;padding:5px 8px}
  .guide-bubble{font-size:12px;padding:7px;min-height:45px;border-radius:16px}
  .mascot-container{transform:scale(.72);margin-bottom:1vh}
  .picture-zone,.read-zone{height:96vh}
  .picture-button{height:43vh;width:22vw}
  .picture-word{font-size:24px}
  .letter-row{min-height:95px}
  .letter-tile{height:84px;min-width:56px;font-size:44px;border-radius:18px;box-shadow:0 6px 0 rgba(24,51,79,.13)}
  .prompt{font-size:16px;padding:5px 13px}
  .blend-line{height:34px;font-size:26px}
  .helper{font-size:12px;min-height:18px}
}
</style>

<div id="game">
  <div class="cloud c1"></div><div class="cloud c2"></div>
  <div class="bubble" style="--x:9%;--s:18px;--d:8s"></div>

  <main class="layout">

      <div class="guide-bubble" id="guideBubble" aria-live="polite">Tap the glowing letter.</div>
      <div class="mascot-container">
        <div class="mascot-sprite idle" id="mascotSprite" aria-hidden="true"></div>
      </div>
    </section>

    <section class="picture-zone">
      <button type="button" class="listen-hint" id="listenButton" aria-label="Hear the word again">🔊</button>
      <button type="button" class="picture-button" id="pictureButton" aria-label="Hear this word"></button>
      <div class="picture-word" id="pictureWord"></div>
    </section>

    <section class="read-zone">
      <div class="prompt" id="prompt">Tap the glowing letter</div>
      <div class="letter-row" id="letterRow" aria-label="Letters"></div>
      <div class="blend-line" id="blendLine" aria-live="polite"></div>
      <div class="helper" id="helper">Start on the left and follow the glow.</div>
    </section>
  </main>
</div>

<div class="rotate-message"><div><span>📱</span>Turn your device sideways to play.</div></div>

const Mascot={
  timers:[],
  el:()=> $('mascotSprite'),
  clear(){this.timers.forEach(clearTimeout);this.timers=[]},
  set(state,frame){const el=this.el();el.className='mascot-sprite '+state;el.style.backgroundPosition=(state==='dancing'&&frame!==undefined)?`-${frame*72}px 0`:''},
  idle(){this.clear();this.set('idle')},
  sad(){this.clear();this.set('sad');this.timers.push(setTimeout(()=>this.set('idle'),900))},
  dance(){this.clear();let i=0;const frames=[0,1,2,3,4,5,4,3,2,1];const run=()=>{if(i>=frames.length){this.set('idle');return}this.set('dancing',frames[i++]);this.timers.push(setTimeout(run,90))};run()}
};

function setGuide(text){$('guideBubble').textContent=text}

function playNarration(key,showText=true,onEnd=null){
  const entry=VOICES[key];
  if(!entry){if(onEnd)onEnd();return}
  if(showText)setGuide(entry.text);
  if(currentAudio){
    if(typeof currentAudio._finish==='function')currentAudio._finish();
    currentAudio.pause();
    currentAudio=null;
  }
  const audio=new Audio(entry.m4a);
  currentAudio=audio;
  let finished=false;
  const done=()=>{if(finished)return;finished=true;if(currentAudio===audio)currentAudio=null;if(onEnd)onEnd()};
  audio._finish=done;
  audio.addEventListener('ended',done,{once:true});
  audio.addEventListener('error',()=>setTimeout(done,450),{once:true});
  const p=audio.play();
  if(p&&p.catch)p.catch(()=>setTimeout(done,Math.min(2600,Math.max(700,entry.text.length*38))));
}

function renderCurrent(){
  $('pictureButton').innerHTML=getSVG(current.svg,current.color);
  $('pictureWord').textContent=current.word;
  $('prompt').textContent='Tap the glowing letter';
  $('blendLine').textContent='';
  $('helper').textContent='Start on the left and follow the glow.';
  const row=$('letterRow');
  row.classList.remove('word-celebrate');
  row.innerHTML='';
  current.chunks.forEach((letter,index)=>{
    const btn=document.createElement('button');
    btn.type='button';
    btn.className='letter-tile '+(index===0?'next':'waiting');
    btn.textContent=letter;
    btn.setAttribute('aria-label',`Letter ${letter.toUpperCase()}`);
    btn.addEventListener('click',()=>tapChunk(index,btn));
    row.appendChild(btn);
  });
  playNarration('word_'+current.word,true);
}

function tapChunk(index,button){
  if(locked)return;
  if(index!==currentIndex){
    button.classList.remove('wiggle');void button.offsetWidth;button.classList.add('wiggle');
    Mascot.sad();
    setGuide(`Tap ${current.chunks[currentIndex].toUpperCase()}.`);
    return;
  }
  const tiles=[...document.querySelectorAll('.letter-tile')];
  button.classList.remove('next','waiting');
  button.classList.add('done');
  currentIndex++;
  if(currentIndex<tiles.length){
    tiles[currentIndex].classList.remove('waiting');
    tiles[currentIndex].classList.add('next');
  }
  const letter=current.chunks[index];
  $('blendLine').textContent=current.chunks.slice(0,currentIndex).join(' · ');
  $('helper').textContent=currentIndex<tiles.length?'Keep moving to the right!':'Now read the whole word!';
  if(currentIndex===current.chunks.length)locked=true;
  playNarration('sound_'+letter,true,()=>{
    if(currentIndex===current.chunks.length)finishWord();
  });
}

function finishWord(){
  if(celebrating)return;
  celebrating=true;
  locked=true;
  const row=$('letterRow');
  row.classList.add('word-celebrate');
  Mascot.dance();
  burst();
  $('prompt').textContent=current.word.toUpperCase()+'!';
  $('blendLine').textContent=current.word;
  $('helper').textContent='Tap the picture to hear the word again.';
  playNarration('word_'+current.word,true,()=>setTimeout(goNext,650));
}

function goNext(){
  const cover=$('transitionCover');
  cover.classList.remove('show');void cover.offsetWidth;cover.classList.add('show');
  setTimeout(nextItem,320);
}

function burst(){
  const rect=$('letterRow').getBoundingClientRect();
  const icons=['✦','●','◆','★'];
  for(let i=0;i<22;i++){
    const s=document.createElement('div');
    s.className='spark';s.textContent=icons[i%icons.length];
    s.style.left=(rect.left+rect.width/2)+'px';s.style.top=(rect.top+rect.height/2)+'px';
    s.style.setProperty('--fs',(10+Math.random()*15)+'px');
    s.style.setProperty('--dx',((Math.random()-.5)*260)+'px');
    s.style.setProperty('--dy',(-40-Math.random()*130)+'px');
    s.style.color=[current.color,'#ffd85a','#2f9ff3','#35c86f'][i%4];
    document.body.appendChild(s);setTimeout(()=>s.remove(),950);
  }
}

function replayWord(){
  if(!current)return;
  playNarration('word_'+current.word,true);
  const pic=$('pictureButton');pic.animate([{transform:'scale(1)'},{transform:'scale(1.09)'},{transform:'scale(1)'}],{duration:420});
}

$('listenButton').addEventListener('click',replayWord);
$('pictureButton').addEventListener('click',replayWord);
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
Mascot.idle();
refillQueue();
nextItem();
</script>
