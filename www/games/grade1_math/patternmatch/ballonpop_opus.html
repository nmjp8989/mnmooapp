<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Action Pattern Match</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: #1A1A2E; color: #FFF;
    font-family: 'Fredoka', sans-serif;
    touch-action: none; user-select: none;
  }
  .game-area { position: relative; width: 100%; height: 100%; overflow: hidden; }
  
  /* Environment */
  .grass-field {
    position: absolute;
    bottom: 0; left: 0; width: 100%; height: 60px;
    background: linear-gradient(to top, #1B5E20, #4CAF50);
    border-top: 6px solid #2E7D32;
    z-index: 10;
  }

  /* Feedback Flashes */
  .flash-overlay {
    position: absolute; inset: 0; pointer-events: none; z-index: 5;
    opacity: 0; transition: opacity 0.2s;
  }
  .flash-overlay.error { background: rgba(255, 82, 82, 0.2); opacity: 1; }
  .flash-overlay.success { background: rgba(0, 200, 83, 0.1); opacity: 1; }

  /* UI Header */
  .header {
    position: absolute; top: 15px; left: 15px; right: 15px;
    display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 30;
  }
  
  /* Pattern Track UI & Next Target */
  .pattern-wrapper {
    display: flex; gap: 15px; align-items: center; justify-content: center; flex-wrap: wrap;
  }
  .pattern-track {
    display: flex; gap: 6px; background: rgba(0,0,0,0.4);
    padding: 10px 20px; border-radius: 20px; align-items: center;
    border: 2px solid rgba(255,255,255,0.1);
  }
  .pattern-track.error { animation: shake 0.4s ease; border-color: #FF5252; }
  .pattern-track.success { animation: pop 0.4s ease; border-color: #00C853; }
  
  .pattern-dot {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.3);
    transition: all 0.3s; opacity: 0.3; display: flex; justify-content: center; align-items: center;
  }
  
  /* Visual grouping separation between pattern repeats (e.g. AB | AB) */
  .pattern-dot.end-of-unit {
    margin-right: 14px;
    position: relative;
  }
  .pattern-dot.end-of-unit::before {
    content: ''; position: absolute; right: -10px; top: 2px; width: 2px; height: 20px; background: rgba(255,255,255,0.15);
  }

  .pattern-dot.active { border-color: #FFF; opacity: 1; transform: scale(1.2); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
  .pattern-dot.filled { opacity: 1; border-color: transparent; }
  .pattern-dot::after { content: '✓'; color: rgba(0,0,0,0.6); font-size: 16px; opacity: 0; }
  .pattern-dot.filled::after { opacity: 1; }

  /* Next Target Box */
  .next-target-box {
    display: flex; gap: 10px; align-items: center;
    background: rgba(0, 0, 0, 0.6);
    padding: 8px 18px; border-radius: 20px;
    border: 2px dashed rgba(255,255,255,0.3);
    transition: transform 0.2s;
  }
  .next-target-box.pulse { animation: pop 0.3s ease; }
  .next-target-label { font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #FFF; }
  .target-dot { 
    width: 28px; height: 28px; border-radius: 50%; 
    border: 2px solid #FFF; transition: background 0.2s, box-shadow 0.2s; 
  }

  /* Voice Bubble */
  .voice-bubble {
    position: absolute; top: 110px; left: 50%; transform: translateX(-50%);
    background: #FFF; color: #1A1A2E; padding: 10px 20px; border-radius: 12px;
    font-size: 18px; font-weight: 700; opacity: 0; transition: opacity 0.3s;
    pointer-events: none; z-index: 50; text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  }
  .voice-bubble.show { opacity: 1; }
  
  /* Mascot */
  .mascot-container {
    position: absolute; 
    bottom: 45px; 
    left: 10%;  
    z-index: 20; 
    transform: scale(1); 
    transform-origin: bottom left;
    pointer-events: none; 
  }
  
  .spr-idle {
    width: 72px;  
    height: 128px; 
    background-image: url('../../../games/assets/cow/idle.webp');
    background-size: 216px 128px;
    image-rendering: pixelated;
    animation: sp-idle .6s steps(3) infinite;
    transform: translateZ(0);
    transition: filter 0.2s; 
  }
  
  .spr-shoot {
    width: 72px;  
    height: 128px; 
    background-image: url('../../../games/assets/cow/gun.webp'); 
    background-size: 216px 128px;
    image-rendering: pixelated;
    transform: translateZ(0);
    transition: filter 0.2s; 
  }

  @keyframes sp-idle { 100% { background-position: -216px 0; } }
  
  /* Balloons */
  .balloon {
    position: absolute; transform: translate(-50%, -50%); pointer-events: none;
    background: var(--bg); border-radius: 50% 50% 50% 50% / 45% 45% 65% 55%;
    box-shadow: inset -8px -8px 20px rgba(0,0,0,0.4); z-index: 5;
  }
  .balloon::before {
    content: ''; position: absolute;
    top: 15%; left: 18%; width: 25%; height: 35%;
    border-radius: 50%; background: rgba(255, 255, 255, 0.4); transform: rotate(-30deg);
  }
  .balloon::after {
    content: ''; position: absolute;
    bottom: -8px; left: 50%; transform: translateX(-50%); width: 0; height: 0;
    border-left: 6px solid transparent; border-right: 6px solid transparent;
    border-bottom: 12px solid var(--bg);
  }

  /* Projectiles */
  .projectile {
    position: absolute; width: 16px; height: 16px; border-radius: 50%;
    transform: translate(-50%, -50%); pointer-events: none;
    box-shadow: 0 0 12px currentColor; z-index: 15;
  }
  .particle { position: absolute; border-radius: 50%; pointer-events: none; z-index: 12;}
  
  .float-text {
    position: absolute; font-size: 24px; font-weight: 700; 
    animation: floatUp 0.8s forwards; pointer-events: none; z-index: 30;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }

  @keyframes floatUp {
    0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -100px) scale(1.2); opacity: 0; }
  }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @keyframes pop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }
</style>
</head>
<body>

<div class="game-area" id="gameArea">
  <div class="grass-field"></div>
  <div class="flash-overlay" id="flashOverlay"></div>
  
  <div class="header">
    <div class="pattern-wrapper">
      <div class="pattern-track" id="patternTrack"></div>
      
      <div class="next-target-box" id="nextTargetBox">
        <div class="next-target-label">Next Shot:</div>
        <div class="target-dot" id="targetDot"></div>
      </div>
    </div>
  </div>
  
  <div class="voice-bubble" id="voiceBubble"></div>

  <div class="mascot-container" id="mascot">
    <div class="spr-idle" id="mascotSprite" aria-hidden="true"></div>
  </div>
</div>

<script>
  // --- CONFIGURATION ---
  const BALLOON_RADIUS = 35;
  const SPRITE_FRAME_WIDTH = 72;
  
  const COLORS = {
    red: { id: 'red', hex: '#FF5252' },
    blue: { id: 'blue', hex: '#448AFF' },
    yellow: { id: 'yellow', hex: '#FFD54F' },
    green: { id: 'green', hex: '#66BB6A' }
  };

  const PATTERNS = [
    { unitLength: 2, sequence: ['red', 'blue', 'red', 'blue', 'red', 'blue'] },                                 
    { unitLength: 4, sequence: ['yellow', 'yellow', 'blue', 'blue', 'yellow', 'yellow', 'blue', 'blue'] },       
    { unitLength: 3, sequence: ['red', 'green', 'yellow', 'red', 'green', 'yellow'] },                         
    { unitLength: 4, sequence: ['green', 'blue', 'red', 'yellow', 'green', 'blue', 'red', 'yellow'] }            
  ];

  let VOICES = {};
  let currentAudio = null;

  let state = {
    patternIdx: 0, seqStep: 0,
    balloons: [], projectiles: [],
    lastTime: performance.now(), spawnTimer: 0
  };

  const gameArea = document.getElementById('gameArea');
  const trackUI = document.getElementById('patternTrack');
  const mascotSprite = document.getElementById('mascotSprite');
  const flashOverlay = document.getElementById('flashOverlay');
  const targetDot = document.getElementById('targetDot');
  const nextTargetBox = document.getElementById('nextTargetBox');

  // --- AUDIO & NARRATION ---
  fetch('ballonpop_voices.json').then(r => r.json()).then(d => {
    VOICES = d;
    triggerVoice('welcome', 'Welcome to Action Pop!');
  }).catch(() => console.log("JSON map loaded with fallbacks."));

  function triggerVoice(key, fallbackText) {
    const bubble = document.getElementById('voiceBubble');
    let text = fallbackText || "";
    let mp3File = null;
    
    if (VOICES[key]) {
      text = VOICES[key].text;
      mp3File = VOICES[key].m4a;
    }
    
    if (!text) return;
    
    bubble.textContent = text;
    bubble.classList.add('show');
    clearTimeout(bubble.hideTimer);
    bubble.hideTimer = setTimeout(() => bubble.classList.remove('show'), 3000);

    if (mp3File) {
      if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
      currentAudio = new Audio(mp3File);
      currentAudio.play().catch(e => console.log("Interaction required for audio audio files."));
    }
  }

  function triggerFlash(type) {
    flashOverlay.className = 'flash-overlay ' + type;
    setTimeout(() => { flashOverlay.className = 'flash-overlay'; }, 200);
  }

  function showFloatText(x, y, text, color) {
    const el = document.createElement('div');
    el.className = 'float-text';
    el.textContent = text;
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.style.color = color || '#FFF';
    gameArea.appendChild(el);
    setTimeout(() => el.remove(), 800);
  }

  // --- UI UPDATES ---
  function getExpectedColor() {
    return COLORS[PATTERNS[state.patternIdx].sequence[state.seqStep]];
  }

  function renderPatternTrack() {
    trackUI.innerHTML = '';
    const currentPattern = PATTERNS[state.patternIdx];
    const seq = currentPattern.sequence;
    const expected = getExpectedColor();
    
    seq.forEach((colorKey, index) => {
      const dot = document.createElement('div');
      dot.className = 'pattern-dot';
      dot.style.background = COLORS[colorKey].hex;

      // Group visual units with visual padding
      if ((index + 1) % currentPattern.unitLength === 0 && index !== seq.length - 1) {
        dot.classList.add('end-of-unit');
      }

      if (index < state.seqStep) dot.classList.add('filled');
      else if (index === state.seqStep) dot.classList.add('active');
      trackUI.appendChild(dot);
    });

    mascotSprite.style.filter = 'none';

    targetDot.style.background = expected.hex;
    targetDot.style.color = expected.hex; 
    targetDot.style.boxShadow = `0 0 15px currentColor`;
    nextTargetBox.style.borderColor = expected.hex;
  }

  function pulseNextTarget() {
    nextTargetBox.classList.remove('pulse');
    void nextTargetBox.offsetWidth;
    nextTargetBox.classList.add('pulse');
  }

  // --- GAMEPLAY LOGIC ---
  function spawnBalloon() {
    const expected = getExpectedColor();
    const forceNeeded = Math.random() < 0.5;
    const colorKeys = Object.keys(COLORS);
    const bColorKey = forceNeeded ? expected.id : colorKeys[Math.floor(Math.random() * colorKeys.length)];
    const hex = COLORS[bColorKey].hex;

    const el = document.createElement('div');
    el.className = 'balloon';
    el.style.width = el.style.height = (BALLOON_RADIUS * 2) + 'px';
    el.style.setProperty('--bg', hex);
    
    gameArea.insertBefore(el, document.querySelector('.grass-field'));

    // Slower drift speeds allow processing time
    state.balloons.push({
      el, radius: BALLOON_RADIUS, colorId: bColorKey,
      x: BALLOON_RADIUS + Math.random() * (window.innerWidth - BALLOON_RADIUS * 2),
      y: -BALLOON_RADIUS * 2, speed: 40 + Math.random() * 40
    });
  }

  gameArea.addEventListener('pointerdown', (e) => {
    const rect = mascotSprite.getBoundingClientRect();
    const startX = rect.left + rect.width / 2;
    const startY = rect.top + (rect.height * 0.2); 
    const angle = Math.atan2(e.clientY - startY, e.clientX - startX);
    
    const deg = angle * (180 / Math.PI);
    let frameIndex = 0;
    
    if (deg <= -70) {
      frameIndex = 2;
    } else if (deg <= -35) {
      frameIndex = 1;
    } else {
      frameIndex = 0;
    }

    mascotSprite.className = 'spr-shoot';
    mascotSprite.style.backgroundPosition = `-${frameIndex * SPRITE_FRAME_WIDTH}px 0px`;
    
    clearTimeout(mascotSprite.aimTimer);
    mascotSprite.aimTimer = setTimeout(() => {
      mascotSprite.className = 'spr-idle';
      mascotSprite.style.backgroundPosition = '';
    }, 300);

    const expectedColor = getExpectedColor();
    const el = document.createElement('div');
    el.className = 'projectile';
    el.style.background = expectedColor.hex;
    el.style.color = expectedColor.hex;
    gameArea.appendChild(el);

    state.projectiles.push({
      el, x: startX, y: startY, radius: 8,
      vx: Math.cos(angle) * 850, vy: Math.sin(angle) * 850
    });
  });

  function processHit(b, p, bIdx, pIdx) {
    const expected = getExpectedColor();
    
    if (b.colorId === expected.id) {
      state.seqStep++;
      showFloatText(b.x, b.y, `✓`, '#00C853');
      pulseNextTarget();
      
      if (state.seqStep >= PATTERNS[state.patternIdx].sequence.length) {
        state.seqStep = 0;
        trackUI.classList.remove('success'); void trackUI.offsetWidth; trackUI.classList.add('success');
        triggerFlash('success');
        triggerVoice('pattern_complete_1', "Pattern Complete!");
        
        // Advance pattern automatically
        if (state.patternIdx < PATTERNS.length - 1) {
          state.patternIdx++;
          triggerVoice('level_up', "New Pattern!");
        } else {
          state.patternIdx = 0; // Loop back to the first pattern
          triggerVoice('level_up', "New Pattern!");
        }
      } else {
        if (Math.random() > 0.6) triggerVoice('correct_1', "Perfect match!");
      }
    } else {
      trackUI.classList.remove('error'); void trackUI.offsetWidth; trackUI.classList.add('error');
      triggerFlash('error');
      showFloatText(b.x, b.y, "✗", '#FF5252');
      triggerVoice(`hint_${expected.id}`, `Oops! Look for a ${expected.id} balloon next!`);
    }
    
    renderPatternTrack();

    for (let i = 0; i < 6; i++) {
      const part = document.createElement('div');
      part.className = 'particle';
      part.style.background = COLORS[b.colorId].hex;
      part.style.width = part.style.height = '12px';
      part.style.left = b.x + 'px'; part.style.top = b.y + 'px';
      gameArea.appendChild(part);
      const ang = Math.random() * Math.PI * 2;
      part.animate([
        { transform: 'translate(-50%,-50%) scale(1)', opacity: 1 },
        { transform: `translate(calc(-50% + ${Math.cos(ang)*40}px), calc(-50% + ${Math.sin(ang)*40}px)) scale(0)`, opacity: 0 }
      ], { duration: 400, fill: 'forwards' });
      setTimeout(() => part.remove(), 400);
    }

    b.el.remove(); p.el.remove();
    state.balloons.splice(bIdx, 1); state.projectiles.splice(pIdx, 1);
  }

  function gameLoop(ts) {
    const dt = Math.min((ts - state.lastTime) / 1000, 0.1);
    state.lastTime = ts;

    const spawnRate = Math.max(0.7, 1.3 - (state.patternIdx * 0.15));
    state.spawnTimer += dt;
    if (state.spawnTimer > spawnRate) { spawnBalloon(); state.spawnTimer = 0; }

    for (let i = state.projectiles.length - 1; i >= 0; i--) {
      let p = state.projectiles[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.el.style.transform = `translate(${p.x}px, ${p.y}px)`;
      if (p.y < 0 || p.x < 0 || p.x > window.innerWidth) {
        p.el.remove(); state.projectiles.splice(i, 1);
      }
    }

    const floorY = window.innerHeight - 30; 

    for (let i = state.balloons.length - 1; i >= 0; i--) {
      let b = state.balloons[i];
      b.y += b.speed * dt;
      b.el.style.transform = `translate(${b.x}px, ${b.y}px)`;
      
      if (b.y > floorY) {
        b.el.remove(); state.balloons.splice(i, 1); continue;
      }

      for (let j = state.projectiles.length - 1; j >= 0; j--) {
        let p = state.projectiles[j];
        if (Math.hypot(b.x - p.x, b.y - p.y) < b.radius + p.radius) {
          processHit(b, p, i, j); break;
        }
      }
    }
    requestAnimationFrame(gameLoop);
  }

  renderPatternTrack();
  requestAnimationFrame(gameLoop);
</script>
</body>
</html>
