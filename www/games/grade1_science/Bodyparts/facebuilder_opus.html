<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff4c7">
<title>Funny Face Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --skin:#FDDCBC;--sdark:#D4A06A;--hair:#3D2314;
  --ink:#3b2b25;--cream:#fffaf0;--line:#ead8c6;--mint:#42c9b6;
  --shadow:0 8px 24px rgba(83,53,30,.13)
}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  background:#fff3c6;
  background-image:
    radial-gradient(circle at 6% 16%,rgba(255,120,120,.24) 0 6%,transparent 6.5%),
    radial-gradient(circle at 93% 83%,rgba(82,195,255,.22) 0 8%,transparent 8.5%),
    linear-gradient(135deg,#fff0b9,#eaf9ff)
}
button{font:inherit;color:inherit}
button:focus-visible{outline:4px solid rgba(66,201,182,.35);outline-offset:2px}
.game{
  height:100dvh;width:100%;padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));
  display:grid;grid-template-columns:minmax(245px,38%) minmax(0,1fr);gap:8px
}
.preview,.play-area{
  min-width:0;min-height:0;background:rgba(255,255,255,.9);border:2px solid rgba(255,255,255,.95);
  border-radius:22px;box-shadow:var(--shadow);overflow:hidden
}
.preview{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:5px;padding:7px}
.face-stage{
  position:relative;min-height:0;display:grid;place-items:center;overflow:hidden;border-radius:17px;
  background:linear-gradient(155deg,#fff8db 0 58%,#dcf6ff 58% 100%);border:2px dashed rgba(87,160,180,.22)
}
.face-stage::before,.face-stage::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.face-stage::before{width:70px;height:70px;left:-22px;bottom:-20px;background:#ffcf82;opacity:.55}
.face-stage::after{width:58px;height:58px;right:-16px;top:-17px;background:#f6a5cd;opacity:.42}
.face-wrap{position:relative;z-index:1;width:100%;height:100%;display:grid;place-items:center;padding:1px}
.face-wrap svg{display:block;width:92%;height:92%;max-width:92%;max-height:92%;filter:drop-shadow(0 5px 5px rgba(80,45,25,.08))}
.face-wrap.celebrate{animation:happyDance .65s ease}
.sparkle{position:absolute;z-index:2;font-size:clamp(15px,2.3vw,25px);pointer-events:none;animation:floaty 2.3s ease-in-out infinite}
.sparkle.s1{left:5%;top:8%}.sparkle.s2{right:6%;top:18%;animation-delay:.8s}.sparkle.s3{right:10%;bottom:5%;animation-delay:1.4s}
.palettes{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 6px;align-items:center;padding:3px 4px}
.palette-label{font-size:clamp(.58rem,1.45vw,.76rem);font-weight:700;text-align:center;line-height:1}
.swatches{display:flex;align-items:center;gap:clamp(3px,.7vw,6px);overflow:hidden;padding:2px}
.swatch{
  width:clamp(19px,2.45vw,28px);height:clamp(19px,2.45vw,28px);flex:0 0 auto;border-radius:50%;
  border:2px solid #fff;box-shadow:0 0 0 1px rgba(58,43,37,.18);cursor:pointer;transition:.14s transform,.14s box-shadow
}
.swatch:active{transform:scale(.82)}.swatch.active{box-shadow:0 0 0 3px var(--mint),0 2px 5px rgba(0,0,0,.15);transform:scale(1.05)}
.play-area{display:grid;grid-template-columns:clamp(66px,9.3vw,92px) minmax(0,1fr);gap:6px;padding:7px}
.category-rail{min-height:0;overflow-y:auto;display:grid;grid-template-columns:1fr;grid-auto-rows:minmax(43px,1fr);gap:4px;scrollbar-width:none}
.category-rail::-webkit-scrollbar,.options::-webkit-scrollbar{display:none}
.category{
  position:relative;border:2px solid var(--cat);background:#fff;border-radius:13px;padding:3px 2px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;transition:.14s transform,.14s background,.14s color
}
.category .emoji{font-size:clamp(1rem,2vw,1.35rem)}
.category .cat-name{font-size:clamp(.55rem,1.15vw,.72rem);font-weight:700;margin-top:2px}
.category:active{transform:scale(.94)}.category.active{background:var(--cat);color:#fff;box-shadow:0 3px 8px rgba(0,0,0,.12)}
.category.done:not(.active)::after{content:"★";position:absolute;right:-2px;top:-4px;color:#ffba08;font-size:.78rem;text-shadow:0 1px #fff,1px 0 #fff,-1px 0 #fff,0 -1px #fff}
.choice-panel{min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:5px}
.fun-top{min-width:0;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px;padding:0 2px}
.say{
  position:relative;min-width:0;background:#fff4a8;border:2px solid #f0c74b;border-radius:12px;padding:5px 9px;
  font-size:clamp(.7rem,1.55vw,.98rem);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.say::before{content:"";position:absolute;left:12px;bottom:-7px;width:11px;height:11px;background:#fff4a8;border-right:2px solid #f0c74b;border-bottom:2px solid #f0c74b;transform:rotate(45deg)}
.star-row{display:flex;gap:2px;align-items:center;white-space:nowrap}
.progress-star{font-size:clamp(.63rem,1.35vw,.88rem);filter:grayscale(1);opacity:.28;transition:.2s transform,.2s filter,.2s opacity}
.progress-star.on{filter:none;opacity:1;transform:scale(1.12)}
.options{
  min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(82px,1fr);
  align-content:start;gap:5px;padding:2px;scrollbar-width:none
}
.option{
  position:relative;min-width:0;min-height:0;border:3px solid var(--line);background:#fff;border-radius:15px;padding:3px;cursor:pointer;
  display:grid;grid-template-rows:minmax(0,1fr) auto;place-items:center;overflow:hidden;transition:.14s transform,.14s border-color,.14s background
}
.option:active{transform:scale(.93)}.option.selected{border-color:var(--cat);background:#fffaf3}
.option.selected::after{content:"✓";position:absolute;right:4px;top:4px;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;background:var(--cat);color:#fff;font-size:.72rem;font-weight:700}
.option svg{width:100%;height:100%;min-height:0}.option-name{width:100%;font-size:clamp(.57rem,1.17vw,.75rem);font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:1px 2px 2px}
.fun-buttons{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fun-button{min-height:39px;border:0;border-radius:13px;padding:6px 8px;color:#fff;font-size:clamp(.72rem,1.55vw,.96rem);font-weight:700;cursor:pointer;box-shadow:0 3px 0 rgba(68,45,30,.14);transition:.12s transform,.12s filter}
.fun-button:active{transform:translateY(2px);box-shadow:none}.mix{background:#8f68e8}.new{background:#ff6f61}
.toast{position:fixed;z-index:80;left:50%;top:9px;transform:translate(-50%,-15px);opacity:0;background:#3b2b25;color:#fff;padding:7px 13px;border-radius:999px;font-weight:700;font-size:.82rem;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;z-index:70;width:8px;height:11px;border-radius:3px;pointer-events:none;animation:confettiFall 1.05s ease-in forwards}
.pop{animation:pop .23s ease-out;transform-box:fill-box;transform-origin:center}
.rotate-screen{display:none;position:fixed;inset:0;z-index:999;background:linear-gradient(145deg,#fff3b0,#dff6ff);padding:28px;text-align:center;align-items:center;justify-content:center;flex-direction:column;color:#3b2b25}
.rotate-phone{font-size:4rem;animation:turnPhone 1.8s ease-in-out infinite}.rotate-screen strong{font-size:1.45rem;margin-top:10px}.rotate-screen span{font-size:1rem;margin-top:5px}
@keyframes pop{0%{transform:scale(.45);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes happyDance{0%,100%{transform:rotate(0) scale(1)}20%{transform:rotate(-3deg) scale(1.03)}40%{transform:rotate(3deg) scale(1.05)}60%{transform:rotate(-2deg)}80%{transform:rotate(2deg)}}
@keyframes floaty{50%{transform:translateY(-6px) rotate(9deg)}}
@keyframes confettiFall{to{transform:translateY(115px) rotate(620deg);opacity:0}}
@keyframes turnPhone{0%,20%,100%{transform:rotate(0)}50%,75%{transform:rotate(90deg)}}
@media (orientation:portrait){.rotate-screen{display:flex}.game{visibility:hidden}}
@media (orientation:landscape) and (max-height:420px){
  .game{padding:max(3px,env(safe-area-inset-top)) max(5px,env(safe-area-inset-right)) max(3px,env(safe-area-inset-bottom)) max(5px,env(safe-area-inset-left));gap:5px;grid-template-columns:minmax(220px,37%) minmax(0,1fr)}
  .preview,.play-area{border-radius:17px}.preview{padding:4px;gap:2px}.face-stage{border-radius:13px}.play-area{padding:4px;gap:4px;grid-template-columns:clamp(58px,8.6vw,74px) minmax(0,1fr)}
  .category-rail{gap:3px;grid-auto-rows:minmax(30px,1fr)}.category{border-radius:10px}.category .emoji{font-size:.95rem}.category .cat-name{font-size:.53rem}
  .choice-panel{gap:3px}.say{padding:3px 7px;border-radius:9px}.options{gap:3px;grid-auto-rows:minmax(68px,1fr)}.option{border-radius:11px;border-width:2px;padding:2px}.option.selected::after{width:16px;height:16px;font-size:.62rem}.fun-button{min-height:32px;padding:4px 7px;border-radius:10px}
  .palettes{gap:2px 5px;padding:1px 2px}.swatches{gap:2px;padding:1px}.swatch{width:15px;height:15px;flex-basis:15px}.palette-label{font-size:.54rem}
}
@media (orientation:landscape) and (max-width:690px){
  .game{grid-template-columns:42% minmax(0,1fr)}.play-area{grid-template-columns:58px minmax(0,1fr)}.options{grid-template-columns:repeat(3,minmax(0,1fr))}.star-row{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="rotate-screen" aria-live="polite"><div class="rotate-phone">📱</div><strong>Turn your phone sideways!</strong><span>The fun works in landscape.</span></div>
<main class="game" aria-label="Funny face maker game">
  <section class="preview" aria-label="Your funny face">
    <div class="face-stage">
      <span class="sparkle s1">⭐</span><span class="sparkle s2">✨</span><span class="sparkle s3">🌟</span>
      <div class="face-wrap" id="faceWrap">
        <svg id="faceSvg" viewBox="0 0 300 400" role="img" aria-label="Your cartoon face">
          <g id="ears-layer"></g>
          <ellipse cx="150" cy="210" rx="115" ry="140" fill="var(--skin)" stroke="var(--sdark)" stroke-width="2.5"/>
          <ellipse cx="82" cy="248" rx="20" ry="11" fill="#FFB5B5" opacity=".2"/>
          <ellipse cx="218" cy="248" rx="20" ry="11" fill="#FFB5B5" opacity=".2"/>
          <g id="facedecor-layer"></g><g id="eyes-layer"></g><g id="eyebrows-layer"></g>
          <g id="nose-layer"></g><g id="mouth-layer"></g><g id="facialhair-layer"></g>
          <g id="hair-layer"></g><g id="accessories-layer"></g>
        </svg>
      </div>
    </div>
    <div class="palettes">
      <span class="palette-label">🙂 Skin</span><div class="swatches" id="skinRow" role="group" aria-label="Skin colours"></div>
      <span class="palette-label">💇 Hair</span><div class="swatches" id="hairRow" role="group" aria-label="Hair colours"></div>
    </div>
  </section>
  <section class="play-area" aria-label="Face choices">
    <nav class="category-rail" id="categories" aria-label="Choose a face part"></nav>
    <div class="choice-panel">
      <div class="fun-top"><div class="say" id="prompt">Pick some fun hair!</div><div class="star-row" id="starRow" aria-label="Progress"></div></div>
      <div class="options" id="options" aria-live="polite"></div>
      <div class="fun-buttons">
        <button class="fun-button mix" id="surpriseBtn" type="button">🎲 Mix It!</button>
        <button class="fun-button new" id="resetBtn" type="button">🌈 New Face</button>
      </div>
    </div>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

function renderPalettes(){
  $('skinRow').innerHTML=SKINS.map((s,i)=>`<button type="button" class="swatch${i===state.skin?' active':''}" data-colour="skin" data-index="${i}" style="background:${s.s}" aria-label="Skin colour ${i+1}" aria-pressed="${i===state.skin}"></button>`).join('');
  $('hairRow').innerHTML=HCOLORS.map((c,i)=>`<button type="button" class="swatch${i===state.hairColor?' active':''}" data-colour="hairColor" data-index="${i}" style="background:${c.h}" aria-label="Hair colour ${i+1}" aria-pressed="${i===state.hairColor}"></button>`).join('');
}
function splitCategoryLabel(label){
  const match=label.match(/^(\S+)\s+(.+)$/);return match?{emoji:match[1],name:match[2]}:{emoji:'⭐',name:label};
}
function renderCategories(){
  $('categories').innerHTML=categoryKeys.map(k=>{const c=C[k],p=splitCategoryLabel(c.l);return `<button type="button" class="category${k===state.tab?' active':''}${state.touched[k]?' done':''}" data-category="${k}" style="--cat:${c.c}" aria-label="${esc(p.name)}" aria-pressed="${k===state.tab}"><span class="emoji">${p.emoji}</span><span class="cat-name">${esc(p.name)}</span></button>`}).join('');
}
function renderStars(){
  $('starRow').innerHTML=categoryKeys.map(k=>`<span class="progress-star${state.touched[k]?' on':''}" aria-hidden="true">★</span>`).join('');
}
function renderOptions(){
  const cat=C[state.tab],chosen=state.selections[state.tab];
  $('prompt').textContent=state.touched[state.tab]?`${cat.o[chosen].n}! Try another or pick a new part.`:prompts[state.tab];
  $('options').style.setProperty('--cat',cat.c);
  $('options').innerHTML=cat.o.map((o,i)=>{
    const art=o.s||'<circle cx="150" cy="210" r="28" fill="#f0e5db"/><path d="M136 196 L164 224 M164 196 L136 224" stroke="#b9aaa0" stroke-width="7" stroke-linecap="round"/>';
    return `<button type="button" class="option${chosen===i?' selected':''}" data-option="${i}" aria-label="${esc(o.n)}" aria-pressed="${chosen===i}"><svg viewBox="${cat.vb}" aria-hidden="true"><ellipse cx="150" cy="210" rx="115" ry="140" fill="var(--skin)" opacity=".18"/>${art}</svg><span class="option-name">${esc(o.n)}</span></button>`;
  }).join('');
  requestAnimationFrame(()=>{const selected=$('options').querySelector('.selected');if(selected)selected.scrollIntoView({block:'nearest'});});
}
function updateLayer(key,animate=true){
  const layer=$(key+'-layer'),option=C[key].o[state.selections[key]];layer.innerHTML=option.s;layer.classList.remove('pop');
  if(animate&&option.s){void layer.getBoundingClientRect();layer.classList.add('pop');}
}
function updateProgress(){
  renderStars();const done=categoryKeys.filter(k=>state.touched[k]).length;
  if(done===categoryKeys.length&&!celebrated){celebrated=true;celebrate();playVoice('all_placed');showToast('Amazing face! ⭐');}
  if(done<categoryKeys.length)celebrated=false;
}
function renderAll(animate=false){applyColours();renderPalettes();renderCategories();renderOptions();categoryKeys.forEach(k=>updateLayer(k,animate));updateProgress();}
function chooseCategory(key){if(!C[key])return;state.tab=key;renderCategories();renderOptions();playVoice('pick_'+key);}
function chooseOption(index){
  const key=state.tab;if(!C[key].o[index])return;state.selections[key]=index;state.touched[key]=true;updateLayer(key,true);renderCategories();renderOptions();updateProgress();playVoice('placed');
}
function chooseColour(kind,index){
  if(kind==='skin')state.skin=index;else state.hairColor=index;applyColours();renderPalettes();playVoice('placed');
}
function randomize(){
  categoryKeys.forEach(k=>{state.selections[k]=1+Math.floor(Math.random()*(C[k].o.length-1));state.touched[k]=true;});
  state.skin=Math.floor(Math.random()*SKINS.length);state.hairColor=Math.floor(Math.random()*HCOLORS.length);celebrated=true;renderAll(true);celebrate();playVoice('win');showToast('What a silly face! 🎉');
}
function resetGame(){
  state={skin:1,hairColor:1,tab:'hair',selections:Object.fromEntries(categoryKeys.map(k=>[k,0])),touched:Object.fromEntries(categoryKeys.map(k=>[k,false]))};celebrated=false;stopVoice();renderAll(false);playVoice('welcome');showToast('Make a new face!');
}
function celebrate(){
  const wrap=$('faceWrap');wrap.classList.remove('celebrate');void wrap.offsetWidth;wrap.classList.add('celebrate');
  const colours=['#ff6b6b','#4ecdc4','#ffd166','#9b72e8','#4d96ff','#ff8cc6'];
  for(let i=0;i<34;i++){const p=document.createElement('i');p.className='confetti';p.style.background=colours[Math.floor(Math.random()*colours.length)];p.style.left=Math.random()*100+'vw';p.style.top=(2+Math.random()*12)+'vh';p.style.animationDelay=Math.random()*.22+'s';document.body.appendChild(p);setTimeout(()=>p.remove(),1300);}
}
function showToast(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').classList.add('show');toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1450);}

async function loadVoices(){
  try{const response=await fetch('facebuilder_voices.json',{cache:'no-store'});if(!response.ok)throw new Error(response.status);const data=await response.json();VOICES=data.phrases||{};}
  catch(error){console.warn('Narration could not be loaded. Keep facebuilder_voices.json beside this HTML file and open it through a web server.',error);VOICES={};}
}
function stopVoice(){if(currentAudio){currentAudio.pause();currentAudio.currentTime=0;currentAudio=null;}}
function playVoice(key){
  if(!audioUnlocked||!VOICES[key]?.m4a)return;stopVoice();currentAudio=new Audio(VOICES[key].m4a);currentAudio.preload='auto';currentAudio.play().catch(()=>{});
}
function bindEvents(){
  document.addEventListener('pointerdown',()=>{audioUnlocked=true;},{once:true,capture:true});
  $('categories').addEventListener('click',e=>{const button=e.target.closest('[data-category]');if(button)chooseCategory(button.dataset.category);});
  $('options').addEventListener('click',e=>{const button=e.target.closest('[data-option]');if(button)chooseOption(Number(button.dataset.option));});
  $('skinRow').addEventListener('click',e=>{const button=e.target.closest('[data-index]');if(button)chooseColour('skin',Number(button.dataset.index));});
  $('hairRow').addEventListener('click',e=>{const button=e.target.closest('[data-index]');if(button)chooseColour('hairColor',Number(button.dataset.index));});
  $('surpriseBtn').addEventListener('click',randomize);$('resetBtn').addEventListener('click',resetGame);
}
async function init(){bindEvents();renderAll(false);await loadVoices();}
init();
</script>
</body>
</html>
